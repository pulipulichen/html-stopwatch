<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<meta name="description" content="精巧的線上碼錶，支援毫秒、快捷鍵與同步迷你視窗。">
<title>00:00 - HTML Stopwatch</title>
<link rel="manifest" href="./manifest.webmanifest?v=c9734dd">
<link rel="icon" href="./assets/favicon.png?v=c9734dd" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=c9734dd">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main aria-label="HTML Stopwatch">
<div class="heading">
<img class="app-icon" src="./assets/favicon.png?v=c9734dd" width="20" height="20" alt="">
<button id="title-button" class="title-button" title="點擊編輯標題" aria-label="編輯標題"><span id="title-track"><span id="title-text">HTML Stopwatch</span><span id="title-repeat" aria-hidden="true"></span></span></button>
<input id="title-input" aria-label="碼錶標題" maxlength="500" autocomplete="off" hidden>
<button id="history-open" class="icon-button" aria-label="歷史紀錄" title="歷史紀錄" aria-haspopup="dialog">◷</button>
<button id="popup" class="icon-button" aria-label="開啟迷你視窗" title="開啟迷你視窗">↗</button>
<button id="install" class="icon-button" aria-label="安裝應用程式" title="安裝應用程式" hidden>↓</button>
</div>
<div id="timer" role="timer" aria-label="經過時間" aria-live="off"><span id="whole">00:00:00</span><span id="fraction">.000</span></div>
<div class="controls">
<button id="toggle" class="primary" title="開始／暫停（Space）">開始</button>
<button id="reset" title="重設（Esc）">重設</button>
<button id="copy" title="複製標題與時間">複製</button>
<span id="status" role="status" aria-live="polite"></span>
</div>
</main>
<dialog id="history-dialog" aria-labelledby="history-heading" aria-describedby="history-note">
<div class="history-heading"><h2 id="history-heading">歷史紀錄</h2><button id="history-close" aria-label="關閉歷史紀錄" autofocus>關閉</button></div>
<p id="history-note">僅儲存於此瀏覽器，保留最新 500 筆。</p>
<p id="history-warning" role="status" hidden>無法保存歷史紀錄，部分變更僅暫存於目前開啟的視窗，關閉後可能遺失。請允許網站儲存或釋放空間。</p>
<div class="history-toolbar"><span id="history-count">0 筆紀錄</span><button id="history-clear" disabled>清除全部</button></div>
<p id="history-empty">還沒有紀錄。暫停或重設有耗時的碼錶後，紀錄會顯示在這裡。</p>
<ol id="history-list" aria-label="碼錶歷史紀錄，最新在前"></ol>
</dialog>
</body>
</html>
